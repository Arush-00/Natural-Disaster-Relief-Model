<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Flood Relief Model Viewer</title>

    <meta name="description" content="Flood relief emergency unit 3D model">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./styles.css">

    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>
</head>


<body>

    <div id="scene">

        <model-viewer src="./Assembly 1 (3).glb" camera-controls environment-image="./flood.hdr"
            skybox-image="./flood.hdr" skybox-height="1.5m" skybox-rotation="90deg" camera-orbit="-42deg 72deg 200m"
            field-of-view="12deg" shadow-softness="0.8" exposure="1" shadow-intensity="1.5" shadow-softness="0.8" style="
        width: 100vw;
        height: 100vh;
      ">

            <!-- Loading bar -->
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>

        </model-viewer>

    </div>

    <script src="./script.js"></script>

</body>

</html>
